name: Native terminal tests
on:
  workflow_dispatch:
    inputs:
      scene:
        type: choice
        default: ligatures
        description: Terminal workload to compare
        options: [ligatures, artwork, collections]
      profile:
        type: boolean
        default: false
        description: Profile the idle rich-text workload on native Linux x64
      before:
        type: string
        required: false
        description: Compare this workload with an earlier library commit on each native host (full SHA)
      release_gallery:
        type: boolean
        default: false
        description: Exercise the published motion, maskot and korlista executables for the version in dunder.toml

permissions: {}

jobs:
  terminal:
    name: ${{ matrix.runner }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            compiler: x86_64-linux.gz
            digest: 8855f35a53123b51ad2670af801a2b8e98bc953bdbbb79ef27d24411413b3d7f
            probe: posix_terminal
          - runner: ubuntu-24.04-arm
            arch: arm64
            compiler: arm64-linux.gz
            digest: b2202bb5c975c609d8408970cf6ceea4198b70735486f534a8a1c23d53ad7b84
            probe: posix_terminal
          - runner: windows-2025
            arch: x64
            compiler: x86_64-windows.exe
            digest: 1fc8481699cb23f3c8447f676f576f51f089c04b3a3c7ac214c94dbd59078b9c
            probe: windows_console
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    env:
      TUI_BENCH_SCENE: ${{ inputs.scene }}
      BENCHMARK: ${{ inputs.scene == 'collections' && 'benchmarks/collections.ddr' || inputs.scene == 'artwork' && 'benchmarks/artwork.ddr' || 'benchmarks/terminal.ddr' }}
    steps:
      - name: Fetch the selected public revision
        run: |
          git init -q
          git config core.autocrlf false
          git fetch --quiet --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Install Dunder 0.11.2
        env:
          ASSET: ${{ matrix.compiler }}
          DIGEST: ${{ matrix.digest }}
        run: |
          mkdir -p build
          curl --fail --silent --show-error --location "https://github.com/Mik-pe/dunder/releases/download/v0.11.2/$ASSET" -o "build/$ASSET"
          echo "$DIGEST  build/$ASSET" | sha256sum --check
          if [[ "$ASSET" == *.exe ]]; then
            mv "build/$ASSET" build/dunder.exe
            echo 'EXT=.exe' >> "$GITHUB_ENV"
            build/dunder.exe --version
          else
            gzip -dc "build/$ASSET" > build/dunder
            chmod +x build/dunder
            echo 'EXT=' >> "$GITHUB_ENV"
            build/dunder --version
          fi
          uname -sm
          rustc --version
      - name: Test the released compiler with the package manifest
        run: |
          if build/dunder$EXT test --locked --offline >build/package-test.log 2>&1; then
            cat build/package-test.log
            echo 'SOURCE_ROOT=.' >> "$GITHUB_ENV"
          else
            cat build/package-test.log
            [[ "$RUNNER_OS" == Windows ]] && grep -Fxq 'Git dependencies require a native compiler host' <(tr -d '\r' <build/package-test.log) || exit 1
            echo '::warning::Dunder 0.11.2 cannot resolve a dependency-free manifest on Windows. Exercising the same revision with its standalone compiler entry point.'
            src=$(cygpath -m "$RUNNER_TEMP")/standalone
            mkdir -p "$src/build"
            git archive HEAD src tests benchmarks examples tools | tar -xf - -C "$src"
            cp build/dunder.exe "$src/build/"
            echo "SOURCE_ROOT=$src" >> "$GITHUB_ENV"
            cd "$src"
            build/dunder.exe build-tests --locked --offline tests/suite.ddr -o build/suite.exe
            build/suite.exe --list | tr -d '\r' >build/tests.txt
            test -s build/tests.txt
            while read -r id name; do build/suite.exe "$id" || { echo "Failed $name"; exit 1; }; done <build/tests.txt
            echo "Passed $(wc -l <build/tests.txt) standalone library tests"
          fi
      - name: Exercise the OS terminal
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          cd "$SOURCE_ROOT"
          build/dunder$EXT build --locked --offline "tests/$PROBE.ddr" -o "build/console$EXT"
          build/console$EXT
          echo "$PROBE passed on $RUNNER_OS $RUNNER_ARCH"
          if [[ "$RUNNER_OS" == Linux ]]; then
            build/dunder build --locked --offline tests/wide_terminal.ddr -o build/wide-terminal
            build/wide-terminal
          fi
      - name: Compare animated canvas pixels, styles and frame diffs
        if: runner.os == 'Linux'
        run: |
          compiler="$PWD/build/dunder"
          cd examples/motion
          "$compiler" test --locked --offline
      - name: Drive the published gallery in a native terminal
        if: inputs.release_gallery
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' dunder.toml)
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$version"
          if [[ "$RUNNER_OS" == Windows ]]; then target=x86_64-windows; suffix=zip
          elif [[ "$RUNNER_ARCH" == ARM64 ]]; then target=arm64-linux; suffix=tar.gz
          else target=x86_64-linux; suffix=tar.gz; fi
          folder="dunder-tui-$version-$target"
          archive="$folder.$suffix"
          mkdir -p build/release
          (
            cd build/release
            curl -fsSL "$base/$archive" -o "$archive"
            curl -fsSL "$base/SHA256SUMS" -o SHA256SUMS
            awk -v name="$archive" '$2 == name' SHA256SUMS | sha256sum --check
            if [[ "$suffix" == zip ]]; then unzip -qo "$archive"; else tar -xzf "$archive"; fi
          )
          app="$PWD/build/release/$folder/motion$EXT"
          mascot="$PWD/build/release/$folder/maskot$EXT"
          rundown="$PWD/build/release/$folder/korlista$EXT"
          if [[ "$RUNNER_OS" == Windows ]]; then
            rundown=$(cygpath -aw "$rundown")
            app=$(cygpath -aw "$app")
            mascot=$(cygpath -aw "$mascot")
            cd "$SOURCE_ROOT"
            build/console.exe "$app"
            build/console.exe "$mascot" --mascot
            build/console.exe "$rundown" --rundown
          else
            build/dunder build --locked --offline tests/motion_terminal.ddr -o build/motion-test
            build/motion-test "$app"
            build/dunder build --locked --offline tests/artwork_terminal.ddr -o build/artwork-test
            build/artwork-test "$mascot"
            build/dunder build --locked --offline tests/rundown_terminal.ddr -o build/rundown-test
            build/rundown-test "$rundown"
          fi
          echo "All ten published gallery scenes and terminal restoration passed on $RUNNER_OS $RUNNER_ARCH"
      - name: Check native child process startup
        if: runner.os == 'Windows'
        run: |
          cd "$SOURCE_ROOT"
          build/dunder.exe build --locked --offline tests/dogfood/compiler/windows_child.ddr -o build/child.exe
          for arg in exec spawn; do
            if build/child.exe "$arg"; then echo "$arg passed"
            else
              code=$?
              test "$code" = 101 || exit "$code"
              echo "::warning::Dunder 0.11.2 std.process $arg exited 101 during child startup on Windows."
            fi
          done
      - name: Isolate the width of the Win32 process ID
        if: runner.os == 'Windows'
        run: |
          cd "$SOURCE_ROOT"
          mkdir -p build/pid-probe
          base=https://raw.githubusercontent.com/Mik-pe/dunder/cd7d1b1fa6a82b1ef80bf0c3545a000a81f44e5b/stdlib
          for path in process.ddr sys/winprocess.ddr; do
            curl -fsSL "$base/$path" -o "build/pid-probe/${path##*/}"
          done
          (
            cd build/pid-probe
            echo '29a5331cfa909e4aac48fe112c72c7881586f4b5f5463842c0b64fd2dfce2509  process.ddr' | sha256sum -c
            echo 'c0bbd4aa79aa5682f0eaf615785b19ad7162f6fb4a141a6705288e1a74c8c920  winprocess.ddr' | sha256sum -c
            sed -i 's/^import std.sys.winprocess as win$/import .winprocess as win/' process.ddr
            sed 's/^import std.process$/import .process as process/' ../../tests/dogfood/compiler/windows_child.ddr >main.ddr
          )
          build/dunder.exe build --offline --locked build/pid-probe/main.ddr -o build/pid-before.exe
          if build/pid-before.exe exec; then exit 1; else test "$?" = 101; fi
          sed -i 's/i32(info\[2\])/i32(load_u32(addr(\&info[2])))/' build/pid-probe/winprocess.ddr
          build/dunder.exe build --offline --locked build/pid-probe/main.ddr -o build/pid-after.exe
          build/pid-after.exe exec
          build/pid-after.exe spawn
          echo 'Reading only the process DWORD passed exec and spawn/wait.'
      - name: Compare cursor lifetime, text cells and completed frames
        run: |
          cd "$SOURCE_ROOT"
          manifest=benchmarks/reference/Cargo.toml
          cargo fetch --locked --manifest-path "$manifest"
          cargo build --release --locked --offline --manifest-path "$manifest" --features layout-cache --example cursor_lifetime --example cell_widgets --example text --example text_edits --example terminal_bench --example layout --target-dir build/rust
          ref=build/rust/release/examples
          build/dunder$EXT build --locked --offline tests/cursor_lifetime.ddr -o "build/lifetime$EXT"
          build/lifetime$EXT >build/dunder-trace 2>build/dunder-errors
          "$ref/cursor_lifetime$EXT" >build/reference-trace 2>build/reference-errors
          diff --strip-trailing-cr build/reference-trace build/dunder-trace
          diff --strip-trailing-cr build/reference-errors build/dunder-errors
          build/dunder$EXT build --locked --offline tests/cell_widgets.ddr -o "build/cell-widgets$EXT"
          build/cell-widgets$EXT | "$ref/cell_widgets$EXT"
          "build/dunder$EXT" build --locked --offline tests/layout_reference.ddr -o "build/layout$EXT"
          "build/layout$EXT" --minimums | "$ref/layout$EXT" --minimums
          build/dunder$EXT build --locked --offline tests/text_edits.ddr -o "build/text-edits$EXT"
          build/text-edits$EXT >build/edited-cells
          "$ref/text_edits$EXT" >build/reference-edits
          diff --strip-trailing-cr build/reference-edits build/edited-cells
          build/dunder$EXT build --locked --offline tools/ligatures.ddr -o "build/cases$EXT"
          build/cases$EXT | tr -d '\r' >build/cases.txt
          build/dunder$EXT build --locked --offline tests/text_reference.ddr -o "build/text$EXT"
          build/text$EXT --overhang | "$ref/text$EXT" --overhang
          build/text$EXT | "$ref/text$EXT"
          build/text$EXT --ligatures build/cases.txt | "$ref/text$EXT" --ligatures build/cases.txt
          build/dunder$EXT build --locked --offline "$BENCHMARK" -o "build/benchmark$EXT"
          build/benchmark$EXT --verify | "$ref/terminal_bench$EXT" --verify
      - name: Compare styled graphemes and time a line traversal
        run: |
          cd "$SOURCE_ROOT"
          manifest=benchmarks/reference/Cargo.toml
          cargo build --release --locked --offline --manifest-path "$manifest" --features style-oracle --example artwork --example paragraph_cells --example large_buffers --example styled_graphemes --example grapheme_bench --target-dir build/rust
          ref=build/rust/release/examples
          build/dunder$EXT build --locked --offline tests/large_buffers.ddr -o "build/large$EXT"
          for mode in "" "--merge"; do
            build/large$EXT $mode >build/large-actual
            "$ref/large_buffers$EXT" $mode >build/large-expected
            diff --strip-trailing-cr build/large-expected build/large-actual
          done
          build/large$EXT --reshape | "$ref/large_buffers$EXT" --reshape
          cargo build --quiet --release --locked --offline --manifest-path "$manifest" --example reshape --target-dir build/rust
          build/dunder$EXT build --locked --offline benchmarks/reshape.ddr -o "build/reshape$EXT"
          for mode in plain styled grow large; do
            for round in {1..5}; do
              if (( round % 2 )); then programs=("build/reshape$EXT" "$ref/reshape$EXT"); else programs=("$ref/reshape$EXT" "build/reshape$EXT"); fi
              for program in "${programs[@]}"; do
                sample=$("$program" "$mode")
                echo "reshape $program $sample"
              done
            done
          done
          build/dunder$EXT build --locked --offline benchmarks/language/shrink_arrays.ddr -o "build/shrink-arrays$EXT"
          for kind in i32 string; do
            for method in resize truncate; do build/shrink-arrays$EXT "$method" "$kind"; done
          done
          build/dunder$EXT build --locked --offline tests/artwork.ddr -o "build/artwork$EXT"
          build/artwork$EXT | "$ref/artwork$EXT"
          build/dunder$EXT build --locked --offline tests/paragraph_cells.ddr -o "build/paragraph-cells$EXT"
          build/paragraph-cells$EXT | "$ref/paragraph_cells$EXT"
          build/dunder$EXT build --locked --offline tests/styled_graphemes.ddr -o "build/styled$EXT"
          build/styled$EXT tests/data/emoji-18.txt tests/data/emoji-variation-18.txt | "$ref/styled_graphemes$EXT"
          build/dunder$EXT build --locked --offline benchmarks/graphemes.ddr -o "build/traverse$EXT"
          for round in 1 2 3; do
            build/traverse$EXT iterator timing
            "$ref/grapheme_bench$EXT" timing
            build/traverse$EXT visitor timing
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            build/dunder build --locked --offline --runtime-profile benchmarks/graphemes.ddr -o build/traverse-profile
            for route in iterator visitor; do
              for mode in setup count; do
                build/traverse-profile "$route" "$mode" 2>"build/$route-$mode.json"
                jq -c --arg run "$route-$mode" '{run:$run,counters:.counters}' "build/$route-$mode.json"
              done
            done
          fi
          cargo build --release --locked --offline --manifest-path "$manifest" --features allocation-counts --example grapheme_bench --target-dir build/rust
          for mode in setup count; do
            echo "Ratatui traversal $mode"
            "$ref/grapheme_bench$EXT" "$mode"
          done
      - name: Build the earlier library revision for comparison
        if: inputs.before != ''
        env:
          BEFORE: ${{ inputs.before }}
        run: |
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BEFORE"
          test "$(git rev-parse FETCH_HEAD)" = "$BEFORE"
          base="$RUNNER_TEMP/tui-before"
          if [[ "$RUNNER_OS" == Windows ]]; then base="$(cygpath -m "$RUNNER_TEMP")/tui-before"; fi
          mkdir -p "$base"
          git archive HEAD benchmarks tests | tar -xf - -C "$base"
          git archive "$BEFORE" src | tar -xf - -C "$base"
          cd "$SOURCE_ROOT"
          build/dunder$EXT build --offline --locked "$base/$BENCHMARK" -o "build/before$EXT"
          build/before$EXT --verify | build/rust/release/examples/terminal_bench$EXT --verify
      - name: Measure the terminal workload
        run: |
          cd "$SOURCE_ROOT"
          ref=build/rust/release/examples/terminal_bench$EXT
          build/dunder$EXT build --locked --offline benchmarks/measure.ddr -o "build/measure$EXT"
          if [[ "$RUNNER_OS" == Linux ]]; then
            build/dunder build --locked --offline benchmarks/pty.ddr -o build/pty
            lscpu | grep -E '^(Architecture|Model name|Hypervisor vendor):'
            build/measure build/benchmark "$ref" build/pty
            if [[ -f build/before ]]; then build/measure build/before build/benchmark build/pty --labels before after; fi
            for round in {1..3}; do
              for program in build/benchmark "$ref"; do
                /usr/bin/time -f "$program peak-rss-kib %M" "$program" >/dev/null
              done
            done
          else
            build/dunder.exe build --locked --offline benchmarks/console.ddr -o build/conhost-bench.exe
            mkdir -p build/samples
            names=(dunder ratatui)
            programs=(build/benchmark.exe "$ref")
            if [[ -f build/before.exe ]]; then names+=(before); programs+=(build/before.exe); fi
            for mode in memory console; do
              for round in {0..8}; do
                for pos in "${!programs[@]}"; do
                  i=$(((round+pos)%${#programs[@]}))
                  sample=build/samples/$mode-${names[i]}-$round
                  cmd=("${programs[i]}")
                  if [[ "$mode" == console ]]; then cmd=(build/conhost-bench.exe "${programs[i]}"); fi
                  "${cmd[@]}" >"$sample.out" 2>"$sample.raw" || { code=$?; cat "$sample.raw"; echo "${cmd[*]} exited $code"; exit "$code"; }
                  tr -d '\r' <"$sample.raw" | grep -v '^written ' >"$sample.stats"
                  if [[ "$mode" == console ]]; then
                    tr -d '\r' <"$sample.raw" | sed -n 's/^written \([0-9][0-9]*\)$/\1/p' >"$sample.bytes"
                    test -s "$sample.bytes"
                  fi
                done
              done
            done
            build/measure.exe --recorded build/samples console
            if [[ -f build/before.exe ]]; then build/measure.exe --recorded build/samples console --labels before dunder; fi
            for round in {1..3}; do
              for program in "${programs[@]}"; do
                build/conhost-bench.exe "$program" --rss >build/peak.txt
                echo "$program peak-working-set-bytes $(cat build/peak.txt)"
              done
            done
          fi
          build/dunder$EXT build --locked --offline --runtime-profile "$BENCHMARK" -o "build/profile$EXT"
          build/profile$EXT --allocations 2>build/dunder-allocations.log
          cat build/dunder-allocations.log
          if ! grep -Fq '"kind":"runtime_profile"' build/dunder-allocations.log; then
            [[ "$RUNNER_OS" == Windows ]] || exit 1
            echo '::warning::Dunder 0.11.2 emitted no allocation report on Windows. Allocation counts are unavailable for this build.'
          fi
          cargo build --release --locked --offline --manifest-path benchmarks/reference/Cargo.toml --features layout-cache,allocation-counts --example terminal_bench --target-dir build/rust
          "$ref" --allocations
      - name: Measure integer row fills and conditional pairs
        if: inputs.profile
        run: |
          cd "$SOURCE_ROOT"
          build/dunder$EXT build --offline --locked benchmarks/language/fill_rows.ddr -o "build/row-fill$EXT"
          build/row-fill$EXT
          build/dunder$EXT build --offline --locked --runtime-profile benchmarks/language/conditional_pair.ddr -o "build/pairs$EXT"
          build/pairs$EXT paired
          build/pairs$EXT scalar
      - name: Profile native x64 instructions for an idle frame
        if: runner.os == 'Linux' && matrix.arch == 'x64' && inputs.profile
        run: |
          cd "$SOURCE_ROOT"
          if ! command -v valgrind >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install --no-install-recommends valgrind
          fi
          build/dunder build -g --locked --offline "$BENCHMARK" -o build/benchmark-symbols
          valgrind --tool=callgrind --callgrind-out-file=build/idle.calls build/benchmark-symbols --idle
          callgrind_annotate --threshold=90 --auto=no build/idle.calls >build/idle-report
          nm -n build/benchmark-symbols >build/native-symbols
          awk '
            NR == FNR {
              address = $1
              if (sub(/^[[:xdigit:]]+[[:space:]]+[A-Za-z][[:space:]]+/, "")) names[address] = $0
              next
            }
            match($0, /0x[[:xdigit:]]+/) {
              address = substr($0, RSTART + 2, RLENGTH - 2)
              if (address in names) { print $0, names[address]; next }
            }
            { print }
          ' build/native-symbols build/idle-report
