[package]
name = "ratatui-render-reference"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }

ratatui-crossterm = { version = "=0.1.2", default-features = false, optional = true }

[features]
allocation-counts = []
layout-cache = ["ratatui/layout-cache"]
terminal-oracle = ["dep:ratatui-crossterm", "ratatui-crossterm/scrolling-regions"]
style-oracle = ["ratatui/underline-color", "ratatui/palette"]

[[example]]
name = "styles"
required-features = ["style-oracle"]

[dev-dependencies]
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

[[example]]
name = "layout_bench"
required-features = ["layout-cache"]

[[example]]
name = "table_bench"
required-features = ["layout-cache"]

[[example]]
name = "chart_bench"
required-features = ["layout-cache"]

[[example]]
name = "terminal"
required-features = ["terminal-oracle"]

[[example]]
name = "viewports"
required-features = ["terminal-oracle"]
