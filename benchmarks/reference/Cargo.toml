[package]
name = "ratatui-render-reference"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false }

ratatui-crossterm = { version = "=0.1.2", default-features = false, optional = true }
ratatui-widgets = { version = "=0.3.2", default-features = false, optional = true }

time = { version = "=0.3.55", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["ratatui/crossterm"]
calendar-oracle = ["ratatui/widget-calendar", "dep:time"]
allocation-counts = []
layout-cache = ["ratatui/layout-cache"]
terminal-oracle = ["dep:ratatui-crossterm", "ratatui-crossterm/scrolling-regions"]
style-oracle = ["ratatui/underline-color", "ratatui/palette"]
serde-oracle = ["ratatui/serde", "dep:serde_json"]
theme-oracle = ["serde-oracle", "ratatui/underline-color"]
serde-backend = ["serde-oracle", "ratatui/scrolling-regions"]
backend-oracle = ["theme-oracle", "serde-backend"]
other-erase-backends = ["erase-oracle", "ratatui/termina", "ratatui/termwiz"]
erase-oracle = ["theme-oracle", "ratatui/crossterm", "ratatui/termion"]
macro-oracle = ["theme-oracle", "ratatui/macros", "dep:ratatui-widgets"]

[[example]]
name = "frame_output"
required-features = ["theme-oracle", "ratatui/crossterm"]

[[example]]
name = "clear_viewport"
required-features = ["erase-oracle"]

[[example]]
name = "erase"
required-features = ["erase-oracle"]

[[example]]
